<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39ff14"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- OCR/Text Symbol -->
  <g transform="translate(256, 256)">
    <!-- Magnifying glass -->
    <circle cx="-20" cy="-40" r="80" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
    <line x1="30" y1="10" x2="110" y2="90" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Text lines inside magnifying glass -->
    <rect x="-100" y="-90" width="140" height="18" rx="9" fill="url(#accent)" opacity="0.9"/>
    <rect x="-100" y="-50" width="100" height="18" rx="9" fill="url(#accent)" opacity="0.7"/>
    <rect x="-100" y="-10" width="120" height="18" rx="9" fill="url(#accent)" opacity="0.5"/>
  </g>
  
  <!-- Decorative scan lines -->
  <line x1="64" y1="420" x2="448" y2="420" stroke="url(#accent)" stroke-width="4" opacity="0.3"/>
  <line x1="64" y1="440" x2="320" y2="440" stroke="url(#accent)" stroke-width="4" opacity="0.2"/>
</svg>