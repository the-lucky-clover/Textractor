name: Textractor
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: YES
packages:
  Crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 2.0.0
targets:
  Textractor:
    type: application
    platform: macOS
    sources:
      - path: Sources/Textractor
        excludes:
          - Info.plist
          - Resources
      - path: Sources/Textractor/Resources
        buildPhase: resources
        excludes:
          - '*.entitlements'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textractor.app
        INFOPLIST_FILE: Sources/Textractor/Info.plist
        PRODUCT_NAME: Textractor
    dependencies:
      - package: Crypto
        product: Crypto
  TextractorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/TextractorUITests]
    dependencies:
      - target: Textractor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textractor.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Textractor:
    build:
      targets:
        Textractor: all
    test:
      targets: [TextractorUITests]
      gatherCoverageData: true
