# Textractor CI/CD Pipeline
# .github/workflows/release.yml
#
# Triggers on: tag push (v*), manual workflow_dispatch
# Requires: Repository secrets configured (see below)
#
# Required Secrets (Settings → Secrets → Actions):
# - ASC_API_ISSUER_ID: App Store Connect API Issuer ID
# - ASC_API_KEY_ID: App Store Connect API Key ID
# - ASC_API_KEY: Base64-encoded AuthKey_XXXXXXXXXX.p8
# - MATCH_PASSWORD: Match repo passphrase
# - MATCH_GIT_URL: Private repo for certificates (e.g., git@github.com:yourorg/certificates.git)
# - SLACK_WEBHOOK_URL: (optional) Slack webhook for notifications
# - APPLE_ID: Your Apple ID email
# - TEAM_ID: Apple Developer Team ID
# - APP_IDENTIFIER: com.textractor.app

name: Release to Mac App Store

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v2.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.0)'
        required: true
        type: string
      skip_notarize:
        description: 'Skip notarization (for testing)'
        required: false
        default: 'false'
        type: boolean
      skip_upload:
        description: 'Skip App Store upload (build only)'
        required: false
        default: 'false'
        type: boolean

env:
  # App configuration
  APP_IDENTIFIER: com.textractor.app
  APP_NAME: Textractor
  SCHEME: Textractor
  BUILD_CONFIGURATION: Release
  
  # Fastlane
  FASTLANE_USER: ${{ secrets.APPLE_ID }}
  FASTLANE_PASSWORD: ${{ secrets.ASC_APP_PASSWORD }}  # Legacy fallback
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
  
  # App Store Connect API
  ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
  ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
  ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
  
  # Slack
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  # ---------------------------------------------------------------------------
  # Build & Test
  # ---------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: macos-14  # macOS 14 (Sonoma) with Xcode 15+
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git tags and version detection
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./fastlane
      
      - name: Install dependencies
        run: |
          cd fastlane
          bundle install --jobs 4 --retry 3
      
      - name: Setup Node (for any webapp tasks)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-packages-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swift-packages-
      
      - name: Build with SPM
        run: |
          swift build -c release
      
      - name: Run unit tests
        run: |
          swift test --parallel
      
      - name: Build .app bundle
        run: |
          ./build.sh
      
      - name: Verify build
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Textractor.app
          spctl --assess --type execute --verbose dist/Textractor.app
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Textractor.app
          path: dist/Textractor.app
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Notarize
  # ---------------------------------------------------------------------------
  notarize:
    name: Notarize
    runs-on: macos-14
    needs: build
    timeout-minutes: 30
    if: ${{ !inputs.skip_notarize }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Textractor.app
          path: dist
      
      - name: Verify downloaded build
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Textractor.app
      
      - name: Create zip for notarization
        run: |
          ditto -c -k --keepParent dist/Textractor.app dist/Textractor.zip
      
      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./fastlane
      
      - name: Decode API Key
        run: |
          echo "${{ secrets.ASC_API_KEY }}" | base64 -d > AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          chmod 600 AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
      
      - name: Notarize
        env:
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
        run: |
          cd fastlane
          bundle exec fastlane mac notarize
      
      - name: Verify stapling
        run: |
          xcrun stapler validate dist/Textractor.app
      
      - name: Upload notarized artifact
        uses: actions/upload-artifact@v4
        with:
          name: Textractor-notarized.app
          path: dist/Textractor.app
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Upload to App Store Connect
  # ---------------------------------------------------------------------------
  upload:
    name: Upload to App Store Connect
    runs-on: macos-14
    needs: notarize
    timeout-minutes: 20
    if: ${{ !inputs.skip_upload }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download notarized build
        uses: actions/download-artifact@v4
        with:
          name: Textractor-notarized.app
          path: dist
      
      - name: Create upload zip
        run: |
          ditto -c -k --keepParent dist/Textractor.app dist/Textractor.zip
      
      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./fastlane
      
      - name: Decode API Key
        run: |
          echo "${{ secrets.ASC_API_KEY }}" | base64 -d > AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          chmod 600 AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
      
      - name: Upload to App Store Connect
        env:
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_PATH: ${{ github.workspace }}/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
        run: |
          cd fastlane
          bundle exec fastlane mac upload
      
      - name: Notify Slack (success)
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#releases'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Post-Release
  # ---------------------------------------------------------------------------
  post_release:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: [upload]
    if: always() && needs.upload.result == 'success'
    
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Textractor ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Textractor.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update Homebrew Formula (if applicable)
        # Add homebrew tap update logic here
        run: echo "Homebrew update would go here"
      
      - name: Notify Slack (release complete)
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#releases'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: '🎉 Textractor ${{ github.ref_name }} released to Mac App Store!'
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Failure Notification
  # ---------------------------------------------------------------------------
  notify_failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, notarize, upload]
    if: failure()
    
    steps:
      - name: Notify Slack (failure)
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#releases'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: '❌ Textractor release failed! Check GitHub Actions.'
        continue-on-error: true