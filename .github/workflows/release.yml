name: Prepare Textractor Pro App Store Candidate

# This workflow is compile validation only. Signed archive/export/upload are
# explicit local actions documented in fastlane/README.md. Pushing a tag does
# not publish a release or contact App Store Connect.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to compile (unsigned archive)'
        required: true
        default: macos
        type: choice
        options: [macos, ios]
      version:
        description: 'Optional marketing version override (checked-in default if empty)'
        required: false
        type: string
      build:
        description: 'Optional build number override (checked-in default if empty)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: appstore-candidate-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install project generator
        run: brew install xcodegen
      - name: Validate release tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Compile candidate archive
        env:
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          args=(--platform "$RELEASE_PLATFORM" --unsigned)
          if [ -n "$RELEASE_VERSION" ]; then args+=(--version "$RELEASE_VERSION"); fi
          if [ -n "$RELEASE_BUILD" ]; then args+=(--build "$RELEASE_BUILD"); fi
          bash scripts/archive_appstore.sh "${args[@]}"
      - name: Package compile evidence
        run: |
          mkdir -p candidate-artifacts
          # Archive through tar to preserve bundle permissions and symlinks.
          tar --exclude=DerivedData -czf candidate-artifacts/Textractor-Pro-unsigned-candidate.tar.gz -C dist appstore
      - uses: actions/upload-artifact@v4
        with:
          name: textractor-pro-unsigned-${{ inputs.platform }}-${{ github.sha }}
          path: candidate-artifacts/Textractor-Pro-unsigned-candidate.tar.gz
          if-no-files-found: error
          retention-days: 14
