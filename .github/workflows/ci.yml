name: Textractor Pro QA
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build and test native services
        run: |
          set -o pipefail
          mkdir -p qa-results
          swift test --enable-code-coverage 2>&1 | tee qa-results/unit-tests.log
      - name: Build standalone bundle
        run: bash build.sh
      - name: Verify development bundle
        run: codesign --verify --deep --strict dist/Textractor.app
      - name: Generate UI test project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Playtest Settings and onboarding
        run: |
          set -o pipefail
          xcodebuild test -project Textractor.xcodeproj -scheme Textractor -destination 'platform=macOS' -resultBundlePath qa-results/playtests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee qa-results/playtests.log
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textractor-pro-qa-${{ github.sha }}
          path: qa-results/
          retention-days: 14
