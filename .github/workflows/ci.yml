name: Textractor Pro QA
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate mobile project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test iOS screenshot review and print packet
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p qa-ios
          ios_device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,items in d["devices"].items() if "iOS" in runtime for x in items if x["name"].startswith("iPhone")))')
          xcodebuild test -project Textractor.xcodeproj -scheme TextractorMobile -destination "platform=iOS Simulator,id=$ios_device" -parallel-testing-enabled NO -resultBundlePath qa-ios/mobile.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee qa-ios/tests.log
      - name: Export iOS playtest screenshots
        if: always()
        timeout-minutes: 2
        run: |
          if [ -d qa-ios/mobile.xcresult ]; then
            xcrun xcresulttool export attachments --path qa-ios/mobile.xcresult --output-path qa-ios/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textractor-ios-qa-${{ github.sha }}
          path: qa-ios/
          retention-days: 14
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate measurement and release-gate logic
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and test native services
        run: |
          set -o pipefail
          mkdir -p qa-results
          export TEXTRACTOR_QA_OUTPUT="$PWD/qa-results"
          swift test --enable-code-coverage 2>&1 | tee qa-results/unit-tests.log
      - name: Score measured OCR results
        run: python3 scripts/benchmark_report.py qa-results/ocr-measurements.json --output qa-results/ocr-summary.json
      - name: Build standalone bundle
        id: bundle
        if: ${{ !cancelled() }}
        run: bash build.sh
      - name: Verify development bundle
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: codesign --verify --deep --strict dist/Textractor.app
      - name: Generate UI test project
        id: ui_project
        if: ${{ !cancelled() }}
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Playtest Settings and onboarding
        if: ${{ !cancelled() && steps.ui_project.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild test -project Textractor.xcodeproj -scheme Textractor -destination 'platform=macOS' -resultBundlePath qa-results/playtests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee qa-results/playtests.log
      - name: Export playtest screenshots
        if: always()
        timeout-minutes: 2
        run: |
          if [ -d qa-results/playtests.xcresult ]; then
            xcrun xcresulttool export attachments --path qa-results/playtests.xcresult --output-path qa-results/screenshots
          fi
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textractor-pro-qa-${{ github.sha }}
          path: qa-results/
          retention-days: 14
