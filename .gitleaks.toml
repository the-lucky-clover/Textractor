# Extend maintained detectors. Paths below are regexes, not shell globs.
[extend]
useDefault = true

[allowlist]
description = "Generated dependencies and binary assets only"
paths = [
  '''(^|/)windows/target/''',
  '''(^|/)node_modules/''',
  '''\.(png|icns|ico|jpg|jpeg|dll|exe|pdb|lib|a)$''',
]

[[rules]]
id = "textractor-asc-key"
description = "App Store Connect key material assigned in source"
regex = '''(?i)asc[_-]?api[_-]?key["'\s:=]+([A-Za-z0-9+/=]{32,})'''
secretGroup = 1
keywords = ["asc_api_key", "asc-api-key"]
